# E2 step: main validation run.
# Rates are in units of one drone's capacity C (req/s), measured in E1
# calibration (calibrate.sh) at the same fixed payload: 20 jets, 50 PF, 5 SV.
# The 2026-10-23 run gave C ≈ 1300 req/s at N = 16, GPU utilisation ~0.83.
# Expected drones in the high phase: 2 drones at 1.1 C each saturate (~0.83 >
# high_allocation 0.75), 3 drones at ~0.73 C each read ~0.70, so it holds at 3.
# ONNX models fail on the V100 nodes (cudaErrorNoKernelImageForDevice with the
# tritonserver:24.11 onnxruntime), so use the PyTorch build of ParticleNet AK4.
model: particlenet_AK4_PT
scale: 1300.0
batch: {min: 20, max: 20}
shapes: {pf: [50, 50], sv: [5, 5]}
phases:
  - {duration: 240, rate: 0.3}
  - {duration: 300, rate: 2.2}
  - {duration: 240, rate: 0.3}
