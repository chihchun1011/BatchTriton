# E3 slow ramp: 0 -> 3 C -> 0 over 40 min. Does the drone count track the load?
# ONNX models fail on the V100 nodes (cudaErrorNoKernelImageForDevice with the
# tritonserver:24.11 onnxruntime), so use the PyTorch build of ParticleNet AK4.
model: particlenet_AK4_PT
scale: 20.0          # placeholder - replace with C from calibration
batch: {min: 1, max: 40}
shapes: {pf: [20, 50], sv: [1, 5]}
phases:
  - {duration: 1200, rate: [0.0, 3.0]}
  - {duration: 1200, rate: [3.0, 0.0]}
