pipeline:
  - __type__: cobald.controller.linear.LinearController
    low_utilisation: 0.25
    high_allocation: 0.75
    rate: 0.1
    interval: 10
  - __type__: cobald.decorator.standardiser.Standardiser
    minimum: 10                                  # always keep one drone (10 cpu cores)
    surplus: 10
  - __type__: cobald.decorator.logger.Logger
    name: 'changes'
  - __type__: tardis.resources.poolfactory.create_composite_pool

logging:
  version: 1
  root:
    level: DEBUG
    handlers: [console, file]
  loggers:
    # Every registry update logs its SQL at DEBUG; nothing reads it.
    cobald.runtime.tardis.plugins.sqliteregistry:
      level: INFO
  formatters:
    precise:
      format: '%(name)s: %(asctime)s %(message)s'
      datefmt: '%Y-%m-%d %H:%M:%S'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: precise
      stream: ext://sys.stdout
    file:
      class: logging.handlers.RotatingFileHandler
      formatter: precise
      filename: ../output/tardis.log
      maxBytes: 104857600
      backupCount: 3

tardis:
  Plugins:
    SqliteRegistry:
      db_file: ../output/drone_registry.db

  # check via condor_status
  BatchSystem:
    adapter: Triton
    max_age: 0.1                                 # re-query condor_q every 6s (unit: min)
    # allocation: 1.0
    # ratios:
    #   cpu_ratio: Real(TotalSlotCpus-Cpus)/TotalSlotCpus
    #   memory_ratio: Real(TotalSlotMemory-Memory)/TotalSlotMemory
    triton_http_port: 8000       # Base Triton HTTP port (health check)
    triton_grpc_port: 8001       # Base Triton gRPC port (inference)
    triton_metrics_port: 8002    # Base Triton Prometheus metrics port
    # Base ports must match start_pilot.sh. Consumers (load tests, Prometheus,
    # proxy) read the actual per-drone ports from discovery_file only.
    discovery_file: ../output/endpoints.json
    # TESTING ONLY: drive scale-up/scale-down by hand. 
    # simulated_utilisation_file: simulated_utilisation.txt
    options:
      pool: c03-001-151.gridka.de          # overlay collector hostname

  Sites:
    - name: TritonGPU
      adapter: HTCondor                           # resource-provider pool
      quota: 40                                    # ← CHANGE: max total CPUs(GPUs) for on pilot
      drone_heartbeat_interval: 5                  # polls state every 5s

  TritonGPU:
    max_age: 1
    MachineTypes:
      - gpu_pilot
    MachineTypeConfiguration:
      gpu_pilot:
        jdl: pilot.jdl                        
    SubmitOptions:
      spool: null
      pool: c03-001-151.gridka.de       
                                                    
    MachineMetaData:
      gpu_pilot:
        Cores: 10
        Memory: 16
        Disk: 40
        # GPUs: 1                                    # need to be implemented