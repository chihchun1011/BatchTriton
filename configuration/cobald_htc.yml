pipeline:
  - __type__: cobald.controller.linear.LinearController
    low_utilisation: 0.90
    high_allocation: 0.90
    rate: 1
  - __type__: cobald.decorator.limiter.Limiter
    minimum: 1
  - __type__: cobald.decorator.logger.Logger
    name: 'changes'
  - __type__: tardis.resources.poolfactory.create_composite_pool

logging:
  version: 1
  root:
    level: DEBUG
    handlers: [console, file]
  formatters:
    precise:
      format: '%(name)s: %(asctime)s %(message)s'
      datefmt: '%Y-%m-%d %H:%M:%S'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: precise
      stream: ext://sys.stdout
    file:
      class: logging.handlers.RotatingFileHandler
      formatter: precise
      filename: ../output/tardis.log
      maxBytes: 10485760
      backupCount: 3

tardis:
  Plugins:
    SqliteRegistry:
      db_file: ../output/drone_registry.db

  # The OVERLAY pool Triton job will actually be submitted to
  # check via condor_status
  BatchSystem:
    adapter: Triton
    max_age: 0.1                                 # re-query condor_q every 6s (unit: min)
    # allocation: 1.0
    # ratios:
    #   cpu_ratio: Real(TotalSlotCpus-Cpus)/TotalSlotCpus
    #   memory_ratio: Real(TotalSlotMemory-Memory)/TotalSlotMemory
    triton_http_port: 8000       # Base Triton HTTP port (health check) 
    triton_metrics_port: 8002    # Base Triton Prometheus metrics port
    discovery_file: ../output/endpoints.json
    # TESTING ONLY: drive scale-up/scale-down by hand instead of real GPU
    # load - `echo 0.95 > simulated_utilisation.txt` to simulate busy,
    # `echo 0.0 > simulated_utilisation.txt` to simulate idle. Remove this
    # key for production (real /metrics utilisation is used instead).
    simulated_utilisation_file: simulated_utilisation.txt
    options:
      pool: c03-001-151.gridka.de          # overlay collector hostname

  Sites:
    - name: TritonGPU
      adapter: HTCondor                           # resource-provider pool
      quota: 40                                    # ← CHANGE: max total CPUs(GPUs) for on pilot
      drone_heartbeat_interval: 5                  # was default 60s - polls state every 5s instead

  TritonGPU:
    max_age: 1
    MachineTypes:
      - gpu_pilot
    MachineTypeConfiguration:
      gpu_pilot:
        jdl: pilot.jdl                        
    SubmitOptions:
      spool: null
      pool: c03-001-151.gridka.de         # ← CHANGE: resource pool 
                                                    
    MachineMetaData:
      gpu_pilot:
        Cores: 10
        Memory: 16
        Disk: 40
        # GPUs: 1                                    # custom key, referenced as ${GPUs} in the JDL