apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: triton
        file_sd_configs:
          - files:
              - /etc/triton-discovery/prometheus_targets.json
            refresh_interval: 30s
